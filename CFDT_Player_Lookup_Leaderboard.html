<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CFDT Player Lookup & Event Leaderboards</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0b0b;color:#fff}
.cfdt{max-width:1050px;margin:auto;padding:22px}
.brand{font-size:13px;letter-spacing:2px;color:#aaa;text-transform:uppercase}
h1{margin:6px 0 18px;font-size:32px}
h2{margin:0 0 6px;font-size:25px}
h3{margin:24px 0 10px;font-size:18px}
.tabs{display:flex;gap:8px;margin:0 0 16px}
.tab{flex:1;padding:13px;border:1px solid #444;background:#151515;color:#fff;border-radius:10px;font-weight:700;cursor:pointer}
.tab.active{background:#2a2a2a;border-color:#777}
.panel{display:none}
.panel.active{display:block}
.event-select{width:100%;padding:14px 16px;border-radius:10px;border:1px solid #444;background:#171717;color:#fff;font-size:16px;outline:none}
.event-head{margin-top:14px;background:#141414;border:1px solid #333;border-radius:14px;padding:18px}
.event-course{color:#aaa;margin-top:5px}
.event-date{color:#888;margin-top:4px;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{padding:11px 8px;border-bottom:1px solid #333;text-align:left}
th{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.6px}
tbody tr:hover{background:#191919}
.pos{font-weight:700;width:55px}
.player-link{color:#fff;text-decoration:underline;text-decoration-color:#555;cursor:pointer}
.score{font-weight:700}
.earn{font-weight:700}
.search{width:100%;padding:15px 17px;border-radius:10px;border:1px solid #444;background:#171717;color:#fff;font-size:17px;outline:none}
.search:focus{border-color:#888}
.results{margin-top:8px}
.result{padding:12px 14px;border-bottom:1px solid #333;cursor:pointer;background:#141414}
.result:hover{background:#202020}
.card{margin-top:16px;background:#141414;border:1px solid #333;border-radius:14px;padding:20px}
.name{font-size:29px;font-weight:700;margin:0}
.sub{color:#aaa;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.stat{background:#202020;border-radius:10px;padding:13px}
.label{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.7px}
.value{font-size:21px;font-weight:700;margin-top:5px}
.empty{padding:30px 10px;text-align:center;color:#999}
.note{color:#888;font-size:12px;margin-top:12px}
@media(max-width:650px){
  .cfdt{padding:16px}
  h1{font-size:27px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .card{padding:15px}
  table{font-size:13px}
  th,td{padding:9px 5px}
  .hide-mobile{display:none}
}
</style>
</head>
<body>
<div class="cfdt">
  <div class="brand">Central Florida Development Tour</div>
  <h1>Player & Event Center</h1>

  <div class="tabs">
    <button class="tab active" onclick="showPanel('leaderboards',this)">Event Leaderboards</button>
    <button class="tab" onclick="showPanel('players',this)">Player Lookup</button>
  </div>

  <section id="leaderboards" class="panel active">
    <select id="eventSelect" class="event-select" onchange="showEvent()"></select>
    <div id="eventBoard"></div>
  </section>

  <section id="players" class="panel">
    <input id="search" class="search" autocomplete="off" placeholder="Search player name..." oninput="searchPlayers()">
    <div id="results" class="results"></div>
    <div id="profile"><div class="empty">Search for a CFDT player above.</div></div>
  </section>
</div>

const byPlayer={};
DATA.forEach(r=>{
  if(!byPlayer[r.player]) byPlayer[r.player]=[];
  byPlayer[r.player].push(r);
});
const names=Object.keys(byPlayer).sort();

function money(n){
  return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function signed(n){
  return n===0 ? "E" : (n>0 ? "+"+n : n);
}
function showPanel(id,btn){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}
function showEvent(){
  const idx=Number(document.getElementById("eventSelect").value);
  const ev=EVENTS[idx];
  const rows=ev.rows;
  const purse=rows.reduce((s,r)=>s+Number(r.earnings||0),0);
  document.getElementById("eventBoard").innerHTML=`
    <div class="event-head">
      <h2>${ev.meta.display.replace("2026 ","")}</h2>
      <div class="event-course">${ev.meta.course}</div>
      <div class="event-date">${new Date(ev.meta.date+"T12:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})} · ${rows.length} players</div>
      <table>
        <thead>
          <tr><th>Pos</th><th>Player</th><th>Score</th><th>To Par</th><th>Earnings</th></tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td class="pos">${r.displayFinish}</td>
              <td><span class="player-link" onclick="openPlayerFromEvent(${JSON.stringify(r.player)})">${r.player}</span></td>
              <td class="score">${r.score}</td>
              <td>${signed(r.toPar)}</td>
              <td class="earn">${Number(r.earnings)>0 ? money(r.earnings) : "—"}</td>
            </tr>`).join("")}
        </tbody>
      </table>
      <div class="note">Event earnings shown from Squabbit's official “Won” amount.</div>
    </div>`;
}
function openPlayerFromEvent(name){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById("players").classList.add("active");
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".tab")[1].classList.add("active");
  showPlayer(name);
}
function searchPlayers(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const box=document.getElementById("results");
  const profile=document.getElementById("profile");
  if(!q){box.innerHTML="";profile.innerHTML='<div class="empty">Search for a CFDT player above.</div>';return;}
  const matches=names.filter(n=>n.toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=matches.map(n=>`<div class="result" onclick="showPlayer(${JSON.stringify(n)})">${n}</div>`).join("");
  if(matches.length===1) showPlayer(matches[0]);
  else if(!matches.length) profile.innerHTML='<div class="empty">No player found.</div>';
}
function showPlayer(name){
  document.getElementById("search").value=name;
  document.getElementById("results").innerHTML="";
  const rows=byPlayer[name].slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const earnings=rows.reduce((s,r)=>s+r.earnings,0);
  const wins=rows.filter(r=>r.finish===1).length;
  const top3=rows.filter(r=>r.finish<=3).length;
  const top5=rows.filter(r=>r.finish<=5).length;
  const top10=rows.filter(r=>r.finish<=10).length;
  const avg=rows.reduce((s,r)=>s+r.score,0)/rows.length;
  document.getElementById("profile").innerHTML=`
  <div class="card">
    <div class="name">${name}</div>
    <div class="sub">CFDT Player Profile</div>
    <div class="stats">
      <div class="stat"><div class="label">Career Earnings</div><div class="value">${money(earnings)}</div></div>
      <div class="stat"><div class="label">Events</div><div class="value">${rows.length}</div></div>
      <div class="stat"><div class="label">Wins</div><div class="value">${wins}</div></div>
      <div class="stat"><div class="label">Top 3s</div><div class="value">${top3}</div></div>
      <div class="stat"><div class="label">Top 5s</div><div class="value">${top5}</div></div>
      <div class="stat"><div class="label">Top 10s</div><div class="value">${top10}</div></div>
      <div class="stat"><div class="label">Scoring Average</div><div class="value">${avg.toFixed(1)}</div></div>
    </div>
    <h3>Tournament History</h3>
    <table>
      <thead><tr><th>Event</th><th>Date</th><th>Score</th><th>Finish</th><th>Earnings</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${r.event.replace("2026 ","")}</td><td>${new Date(r.date+"T12:00:00").toLocaleDateString("en-US")}</td><td>${r.score} (${signed(r.toPar)})</td><td>${r.finish}</td><td>${money(r.earnings)}</td></tr>`).join("")}</tbody>
    </table>
  </div>`;
}

const sel=document.getElementById("eventSelect");
EVENTS.forEach((ev,i)=>{
  const opt=document.createElement("option");
  opt.value=i;
  opt.textContent=ev.meta.display.replace("2026 ","");
  sel.appendChild(opt);
});
sel.value=EVENTS.length-1;
